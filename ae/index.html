<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Moved &mdash; Clair Oral Care</title>
<!-- The UAE landing page was retired on 2026-08-13. The URL stays alive so inbound links,
     printed codes and search results land somewhere useful instead of a 404.
     A zero-delay refresh plus a canonical is how you spell a 301 on a host
     that cannot send one, and Google treats it as a permanent redirect,
     consolidating this URL into the home page.

     There is deliberately no noindex. It was here at first, and it fought the
     canonical: one says drop this page, the other says fold it into the home
     page. Google warns against pairing them, and the risk runs the wrong way -
     the noindex can carry across to the canonical target, which is the home
     page. Let the redirect do the work. -->
<link rel="canonical" href="https://clairoral.com/">
<meta http-equiv="refresh" content="0; url=/">
<style>
  body { background:#e8f3f6; color:#26474b; font:15px/1.6 system-ui, sans-serif;
         display:grid; place-items:center; min-height:100vh; margin:0; padding:24px; text-align:center }
  a { color:#0b6e7a }
</style>
</head>
<body>
<p>This page has moved.<br><a href="/">Continue to Clair Oral Care</a></p>
<script>location.replace('/');</script>
</body>
</html>
